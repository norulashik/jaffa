<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-impact {
            background: radial-gradient(circle, rgba(0, 255, 171, 0.15) 0%, rgba(20, 209, 255, 0.05) 50%, transparent 70%);
        }
        .text-glow {
            text-shadow: 0 0 20px rgba(0, 255, 171, 0.6);
        }
        .bg-stadium-gradient {
            background: radial-gradient(circle at center, #1e2024 0%, #111317 60%, #0c0e12 100%);
        }
        .cracked-line {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            height: 1px;
            position: absolute;
            transform-origin: left center;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface font-body text-on-surface min-h-screen overflow-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Splash Screen Container -->
<main class="relative h-screen w-full flex flex-col items-center justify-center bg-stadium-gradient">
<!-- Ambient Deep Purple Glow -->
<div class="absolute inset-0 overflow-hidden pointer-events-none">
<div class="absolute -top-1/4 -left-1/4 w-full h-full bg-on-tertiary-fixed-variant/20 blur-[120px] rounded-full"></div>
<div class="absolute -bottom-1/4 -right-1/4 w-full h-full bg-on-secondary-container/10 blur-[120px] rounded-full"></div>
</div>
<!-- Impact Effect Layers -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<!-- Radial Impact Glow -->
<div class="glass-impact w-[140vw] h-[140vw] max-w-[1200px] max-h-[1200px] rounded-full"></div>
<!-- Stylized Fractures -->
<div class="absolute w-full h-full">
<div class="cracked-line w-[400px] rotate-[15deg] top-1/2 left-1/2 opacity-20"></div>
<div class="cracked-line w-[300px] rotate-[165deg] top-1/2 left-1/2 opacity-10"></div>
<div class="cracked-line w-[500px] rotate-[280deg] top-1/2 left-1/2 opacity-15"></div>
<div class="cracked-line w-[350px] rotate-[75deg] top-1/2 left-1/2 opacity-5"></div>
</div>
</div>
<!-- Central Content Cluster -->
<div class="relative z-10 flex flex-col items-center">
<!-- Glassmorphic Logo Container -->
<div class="relative mb-12 group">
<!-- Inner Neon Ring -->
<div class="absolute inset-0 bg-primary-container/20 blur-3xl scale-125 opacity-50"></div>
<!-- The "Impact" Logo Section -->
<div class="relative bg-surface-bright/30 backdrop-blur-2xl p-10 rounded-full border border-white/10 shadow-[0_0_80px_rgba(0,255,171,0.15)] flex items-center justify-center overflow-hidden">
<!-- Impact Icon Overlay -->
<span class="material-symbols-outlined text-8xl text-primary-container text-glow" style="font-variation-settings: 'FILL' 1;">
                        sports_cricket
                    </span>
<!-- Internal Reflection -->
<div class="absolute inset-0 bg-gradient-to-tr from-white/10 to-transparent pointer-events-none"></div>
</div>
<!-- Floating Dust/Particles -->
<div class="absolute -top-4 -right-2 w-2 h-2 bg-secondary-container rounded-full blur-[1px]"></div>
<div class="absolute bottom-8 -left-6 w-1 h-1 bg-primary-container rounded-full blur-[1px]"></div>
</div>
<!-- Brand Typography -->
<div class="text-center space-y-4 px-6">
<h1 class="font-headline font-black italic text-7xl md:text-9xl tracking-[0.2em] text-primary-container uppercase drop-shadow-[0_0_30px_rgba(0,255,171,0.4)]">
                    JAFFA
                </h1>
<div class="h-1 w-24 bg-gradient-to-r from-transparent via-primary-container to-transparent mx-auto"></div>
<p class="font-label text-secondary-fixed-dim uppercase tracking-[0.4em] text-xs md:text-sm font-bold opacity-80 mt-6">
                    Predict. Play. Win at your café.
                </p>
</div>
</div>
<!-- Progress/Pulse Meter at Bottom -->
<div class="absolute bottom-16 w-48 h-[2px] bg-surface-container-highest overflow-hidden rounded-full">
<div class="h-full w-2/3 bg-gradient-to-r from-secondary-container to-primary-container shadow-[0_0_10px_#00FFAB] animate-[pulse_2s_infinite]"></div>
</div>
<!-- Corner Details for Broadcast Feel -->
<div class="absolute top-10 left-10 hidden md:block">
<div class="flex items-center gap-3">
<div class="w-3 h-3 bg-red-600 rounded-full animate-pulse"></div>
<span class="font-label text-xs font-bold tracking-widest text-on-surface-variant uppercase">Live Stream Connected</span>
</div>
</div>
<div class="absolute bottom-10 right-10 hidden md:block">
<div class="flex flex-col items-end">
<span class="font-headline text-lg font-bold text-on-surface opacity-30">V.2.4.0</span>
<span class="font-label text-[10px] tracking-widest text-on-surface-variant uppercase">Stadium Engine Active</span>
</div>
</div>
<!-- Call to Action / Interactive Entrance -->
<div class="absolute bottom-24 z-20">
<button class="group flex items-center gap-4 px-8 py-4 bg-primary-container text-on-primary-container rounded-md font-headline font-extrabold text-lg uppercase tracking-wider transition-all hover:shadow-[0_0_40px_rgba(0,255,171,0.4)] active:scale-95">
                Enter Arena
                <span class="material-symbols-outlined transition-transform group-hover:translate-x-1">
                    double_arrow
                </span>
</button>
</div>
</main>
