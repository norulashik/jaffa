<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "error-container": "#93000a",
              "tertiary-fixed": "#e9ddff",
              "on-surface-variant": "#b9cbbe",
              "on-primary-container": "#00714a",
              "surface-tint": "#00e297",

            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(30, 32, 36, 0.6);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(0, 255, 171, 0.1);
        }
        .neon-glow {
            box-shadow: 0 0 20px rgba(0, 255, 171, 0.2);
        }
        .stadium-gradient {
            background: radial-gradient(circle at center, #1a1c20 0%, #0c0e12 100%);
        }
    </style>
</head>
<body class="bg-surface-container-lowest text-on-surface font-body min-h-screen flex flex-col selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation Suppression: Not rendered for Login screen per UX Goal -->
<main class="flex-grow flex items-center justify-center p-6 stadium-gradient relative overflow-hidden">
<!-- Background Ambient Elements -->
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-on-tertiary-fixed-variant/10 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-primary-container/5 rounded-full blur-[120px]"></div>
<div class="w-full max-w-md z-10">
<!-- Brand Anchor -->
<div class="text-center mb-10">
<h1 class="font-headline font-black italic text-5xl text-primary-container tracking-widest uppercase mb-2">JAFFA</h1>
<p class="font-label text-secondary-fixed-dim text-xs tracking-[0.3em] uppercase opacity-70">Admin Portal Access</p>
</div>
<!-- Login Card -->
<div class="glass-panel p-8 rounded-lg neon-glow">
<div class="mb-8">
<h2 class="font-headline text-2xl font-bold text-white mb-1">Welcome Back</h2>
<p class="font-body text-sm text-on-surface-variant">Enter your credentials to manage your venue.</p>
</div>
<form class="space-y-6">
<div>
<label class="block font-label text-[10px] uppercase tracking-widest text-primary-container mb-2 ml-1">Owner phone number</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary-container transition-colors" data-icon="phone">phone</span>
<input class="w-full bg-surface-container-lowest border-none text-on-surface py-4 pl-12 pr-4 rounded-lg focus:ring-2 focus:ring-primary-container/30 transition-all font-body placeholder:text-outline-variant" placeholder="+91 00000 00000" type="tel"/>
</div>
</div>
<div>
<div class="flex justify-between items-center mb-2">
<label class="block font-label text-[10px] uppercase tracking-widest text-primary-container ml-1">Password</label>
<a class="font-label text-[10px] uppercase tracking-widest text-secondary-fixed-dim hover:text-white transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary-container transition-colors" data-icon="lock">lock</span>
<input class="w-full bg-surface-container-lowest border-none text-on-surface py-4 pl-12 pr-4 rounded-lg focus:ring-2 focus:ring-primary-container/30 transition-all font-body placeholder:text-outline-variant" placeholder="••••••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant hover:text-white" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<div class="pt-2">
<button class="w-full bg-primary-container text-on-primary-container font-headline font-black text-sm uppercase tracking-widest py-4 rounded-lg hover:bg-primary-fixed-dim transition-all duration-300 shadow-[0_0_25px_rgba(0,255,171,0.25)] flex items-center justify-center gap-2 group" type="submit">
<span>Login</span>
<span class="material-symbols-outlined text-lg group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
<div class="mt-8 pt-8 border-t border-white/5 flex flex-col items-center gap-4">
<p class="font-body text-xs text-on-surface-variant">New partner venue?</p>
<button class="w-full bg-surface-container-high text-white font-label text-[11px] font-bold uppercase tracking-widest py-3 rounded-lg border border-white/10 hover:border-primary-container/50 hover:bg-surface-bright transition-all">
                        REGISTER VENUE
                    </button>
</div>
</div>
<!-- Decorative Pulse element -->
<div class="mt-8 flex justify-center">
<div class="flex items-center gap-2 bg-primary-container/10 px-4 py-2 rounded-full">
<div class="w-2 h-2 rounded-full bg-primary-container animate-pulse"></div>
<span class="font-label text-[10px] uppercase tracking-wider text-primary-container">Secure Server Connection Active</span>
</div>
</div>
</div>
</main>
<!-- Footer from JSON Blueprint -->
<footer class="bg-[#0c0e12] flex flex-col md:flex-row justify-between items-center px-8 py-6 w-full text-center gap-4 border-t border-white/5 z-20">
<div class="text-[#00FFAB] font-bold font-['Manrope'] text-[10px] uppercase tracking-widest">
            © 2024 JAFFA PREDICTION ENGINE. ALL RIGHTS RESERVED.
        </div>
<div class="flex flex-wrap justify-center gap-6">
<a class="text-slate-500 font-['Manrope'] text-[10px] uppercase tracking-widest hover:text-white transition-all opacity-80 hover:opacity-100" href="#">Terms of Service</a>
<a class="text-slate-500 font-['Manrope'] text-[10px] uppercase tracking-widest hover:text-white transition-all opacity-80 hover:opacity-100" href="#">Privacy Policy</a>
<a class="text-slate-500 font-['Manrope'] text-[10px] uppercase tracking-widest hover:text-white transition-all opacity-80 hover:opacity-100" href="#">Admin Support</a>
<div class="flex items-center gap-1.5">
<span class="w-1 h-1 rounded-full bg-[#00FFAB]"></span>
<a class="text-slate-500 font-['Manrope'] text-[10px] uppercase tracking-widest hover:text-white transition-all opacity-80 hover:opacity-100" href="#">System Status</a>
</div>
</div>
</footer>
</body></html>
