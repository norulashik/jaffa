<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(26, 28, 32, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
        .neon-glow {
            box-shadow: 0 0 20px rgba(0, 255, 171, 0.35);
        }
        .stadium-gradient {
            background: radial-gradient(circle at top right, rgba(20, 209, 255, 0.08), transparent),
                        radial-gradient(circle at bottom left, rgba(0, 255, 171, 0.05), transparent);
        }
        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            background-size: 200% 100%;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface-container-lowest text-on-surface font-body selection:bg-primary-container/30 stadium-gradient min-h-screen flex flex-col">
<!-- Top Navigation Bar - Contextually Suppressed labels but brand preserved -->
<header class="fixed top-0 w-full flex justify-between items-center px-6 py-4 max-w-none bg-slate-900/40 backdrop-blur-xl z-50">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[#00FFAB]" data-icon="sports_cricket">sports_cricket</span>
<span class="font-['Space_Grotesk'] font-black italic text-[#00FFAB] tracking-widest text-2xl uppercase">JAFFA</span>
</div>
<div class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center border border-outline-variant/20">
<span class="material-symbols-outlined text-on-surface-variant text-sm" data-icon="help">help</span>
</div>
</header>
<main class="flex-grow flex items-center justify-center px-6 pt-24 pb-12">
<div class="w-full max-w-md space-y-10">
<!-- Branding/Hero Section -->
<div class="text-left space-y-2">
<h1 class="font-headline text-4xl md:text-5xl font-extrabold tracking-tight text-on-surface">
                    The Arena <br/>
<span class="text-primary-container">Awaits.</span>
</h1>
<p class="font-body text-on-surface-variant text-sm max-w-[280px]">
                    Enter your mobile number to join the most intense cricket prediction circle.
                </p>
</div>
<!-- Login Form -->
<div class="space-y-8">
<!-- Phone Input Field -->
<div class="relative group">
<div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-on-surface-variant group-focus-within:text-primary-container transition-colors">
<span class="font-label font-bold text-sm">+91</span>
</div>
<input class="block w-full pl-14 pr-4 py-5 bg-surface-container-low border-0 rounded-xl focus:ring-2 focus:ring-primary-container/30 font-headline font-bold text-lg tracking-[0.2em] placeholder:text-transparent peer" id="phone" placeholder="Phone Number" type="tel"/>
<label class="absolute text-on-surface-variant duration-300 transform -translate-y-4 scale-75 top-2 z-10 origin-[0] bg-surface-container-low px-2 peer-focus:px-2 peer-focus:text-primary-container peer-placeholder-shown:scale-100 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:top-1/2 peer-focus:top-2 peer-focus:scale-75 peer-focus:-translate-y-4 left-12 font-label text-xs uppercase tracking-widest font-bold pointer-events-none" for="phone">
                        Mobile Number
                    </label>
</div>
<!-- Action Button -->
<button class="relative w-full overflow-hidden bg-primary-container hover:bg-primary-fixed-dim text-on-primary-container font-headline font-extrabold text-sm uppercase tracking-widest py-5 rounded-xl transition-all duration-300 active:scale-95 neon-glow group">
<span class="relative z-10 flex items-center justify-center gap-2">
                        Send OTP
                        <span class="material-symbols-outlined text-lg" data-icon="arrow_forward">arrow_forward</span>
</span>
<!-- Shimmer Layer -->
<div class="absolute inset-0 shimmer opacity-0 group-hover:opacity-100 transition-opacity"></div>
</button>
<!-- OTP Entry Section (Visible after Send OTP) -->
<div class="space-y-6 pt-4">
<div class="flex items-center justify-between px-1">
<label class="font-label text-[10px] font-extrabold uppercase tracking-[0.2em] text-on-surface-variant">Verify Secure Code</label>
<button class="text-[10px] font-extrabold uppercase tracking-widest text-secondary-container hover:text-primary-container transition-colors">Resend in 0:45</button>
</div>
<div class="grid grid-cols-6 gap-3">
<input class="w-full aspect-square text-center bg-surface-container-high/40 backdrop-blur-md border-0 rounded-lg font-headline font-bold text-xl text-primary-container focus:ring-2 focus:ring-primary-container/40 transition-all shadow-inner" maxlength="1" type="text" value="7"/>
<input class="w-full aspect-square text-center bg-surface-container-high/40 backdrop-blur-md border-0 rounded-lg font-headline font-bold text-xl text-primary-container focus:ring-2 focus:ring-primary-container/40 transition-all shadow-inner" maxlength="1" type="text" value="2"/>
<input class="w-full aspect-square text-center bg-surface-container-high/40 backdrop-blur-md border-0 rounded-lg font-headline font-bold text-xl text-on-surface focus:ring-2 focus:ring-primary-container/40 transition-all shadow-inner border-b-2 border-primary-container/30" maxlength="1" type="text"/>
<input class="w-full aspect-square text-center bg-surface-container-high/40 backdrop-blur-md border-0 rounded-lg font-headline font-bold text-xl text-on-surface focus:ring-2 focus:ring-primary-container/40 transition-all shadow-inner" maxlength="1" type="text"/>
<input class="w-full aspect-square text-center bg-surface-container-high/40 backdrop-blur-md border-0 rounded-lg font-headline font-bold text-xl text-on-surface focus:ring-2 focus:ring-primary-container/40 transition-all shadow-inner" maxlength="1" type="text"/>
<input class="w-full aspect-square text-center bg-surface-container-high/40 backdrop-blur-md border-0 rounded-lg font-headline font-bold text-xl text-on-surface focus:ring-2 focus:ring-primary-container/40 transition-all shadow-inner" maxlength="1" type="text"/>
</div>
</div>
</div>
<!-- Footer Messaging -->
<div class="text-center space-y-6">
<p class="font-body text-xs text-on-surface-variant opacity-60">
                    By continuing, you agree to Jaffa's <span class="underline text-on-surface">Terms of Play</span> and <span class="underline text-on-surface">Privacy Rules</span>.
                </p>
<div class="flex items-center justify-center gap-4 text-xs font-label font-bold text-on-surface-variant uppercase tracking-widest pt-4">
<span class="w-8 h-[1px] bg-outline-variant/30"></span>
<span>Success → smooth transition</span>
<span class="w-8 h-[1px] bg-outline-variant/30"></span>
</div>
</div>
</div>
</main>
<!-- Visual Background Element -->
<div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
<div class="absolute -top-[10%] -right-[10%] w-[60%] h-[40%] bg-secondary-container/5 rounded-full blur-[120px]"></div>
<div class="absolute -bottom-[20%] -left-[10%] w-[80%] h-[50%] bg-primary-container/5 rounded-full blur-[140px]"></div>

</div>
</body></html>
